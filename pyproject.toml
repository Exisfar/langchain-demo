[project]
name = "langchain-demo"
version = "0.1.0"
description = "循序渐进的 LangChain Python 学习示例"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-text-splitters>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3",
    "numpy>=2",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
